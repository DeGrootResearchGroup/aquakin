# Codecov configuration.
#
# Coverage is collected per CI tier and uploaded under a flag: `fast` (every
# push/PR), `slow` and `validation` (push-to-main and `full-ci` PRs only). The
# project badge/number is the union of all flags.
#
# carryforward: slow/validation do not run on a normal PR, so without this a PR
# build would report only `fast` coverage and look like a regression. Carrying
# forward reuses each flag's last known coverage when a build does not upload it,
# so PRs show the full combined picture.
#
# The project status is informational (it never fails CI): it is a badge and a
# report, not a gate. The patch status is a target of 100%: every line a PR
# adds or changes is expected to be covered by the tests that ran on it, with
# `threshold: 0%` so nothing short of that reads as green. It is a signal, not a
# required check: a red patch status asks the PR to add the test or to say which
# lines are uncovered and why. On a normal PR only the `fast` flag uploads, so
# code covered only by slow / validation / heavy tests counts as uncovered
# unless the PR carries the `full-ci` label, and Codecov counts moved lines as
# changed; see docs/ci.md.
#
# The fast tier uploads once per run, from the `fast-coverage` job after every
# fast shard has finished (.github/workflows/ci.yml), so the PR comment and
# patch status are built from the whole fast tier. Per-shard uploads made
# Codecov report after the first few, and `after_n_builds` did not prevent it
# (the carried-forward sessions count toward it).

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 100%
        threshold: 0%

flag_management:
  default_rules:
    carryforward: true

flags:
  fast:
    carryforward: true
  slow:
    carryforward: true
  validation:
    carryforward: true
  # heavy/xheavy run only on adjoint/plant merges + full-ci PRs, so carryforward
  # is essential -- otherwise the whole-plant stable-adjoint coverage would drop
  # out on every build that does not trigger the heavy tier.
  heavy:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
