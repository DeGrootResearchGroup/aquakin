model:
  name: sbr_decay
  version: "1.0"
  description: >
    First-order decay A -> B with a COD content on both species, for the small
    SBR plant: B is taken as the settling particulate, and COD is conserved by
    the reaction, so a plant's mass balance closes on inflow, outflow and
    accumulation alone.
  references: []

species:
  - name: A
    description: "Soluble reactant"
    units: g_COD/m3
    default_concentration: 1.0
    composition: {COD: 1.0}
  - name: B
    description: "Particulate product"
    units: g_COD/m3
    default_concentration: 0.0
    composition: {COD: 1.0}

conditions:
  - name: T
    description: "Temperature (K), unused in rate."
    default: 293.15

reactions:
  - name: A_to_B
    description: "First-order decay."
    rate: "k * [A]"
    parameters:
      k:
        value: 0.1
        units: "s-1"
        bounds: [1.0e-3, 10.0]
    stoichiometry:
      A: -1
      B: +1
