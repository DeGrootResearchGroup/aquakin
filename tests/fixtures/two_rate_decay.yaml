model:
  name: two_rate_decay
  version: "1.0"
  description: "First-order decay A -> B through two lumped pathways, for testing two-parameter posteriors."
  references: []

species:
  - name: A
    description: "Reactant"
    units: mol/L
    default_concentration: 1.0
  - name: B
    description: "Product"
    units: mol/L
    default_concentration: 0.0

conditions:
  - name: T
    description: "Temperature (K), unused in rate."
    default: 293.15

reactions:
  - name: A_to_B
    description: "First-order decay through two pathways, k1 and k2, seen only as their sum."
    rate: "(k1 + k2) * [A]"
    parameters:
      k1:
        value: 0.5
        units: "s-1"
      k2:
        value: 0.5
        units: "s-1"
    stoichiometry:
      A: -1
      B: +1
