model:
  name: catalysed_decay
  version: "1.0"
  description: >
    A -> B catalysed by X, which is not consumed. A(t) = A0 exp(-k [X]0 t), so
    only the product k [X]0 can be estimated from observations of A.
  references: []

species:
  - name: A
    description: "Reactant"
    units: mol/L
    default_concentration: 1.0
  - name: B
    description: "Product"
    units: mol/L
    default_concentration: 0.0
  - name: X
    description: "Catalyst (constant)"
    units: mol/L
    default_concentration: 2.0

conditions:
  - name: T
    description: "Temperature (K), unused in rate."
    default: 293.15

reactions:
  - name: A_to_B
    description: "Second-order decay of A on the catalyst X."
    rate: "k * [A] * [X]"
    parameters:
      k:
        value: 0.1
        units: "L mol-1 s-1"
    stoichiometry:
      A: -1
      B: +1
