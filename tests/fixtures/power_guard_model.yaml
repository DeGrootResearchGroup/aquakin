model:
  name: power_guard
  version: "1.0"
  description: >
    Half-order kinetics written both ways, for the power guard's tests. A is
    consumed at "k * [A] ** 0.5" and C at "k * sqrt([C])" -- the same
    mathematics in the two spellings the rate language offers. Both sit exactly
    on the singularity whenever their reactant depletes, which is where the
    derivative of a fractional power is infinite. Not a physical model.
  references: []

parameters:
  k:
    value: 0.2
    units: "mol0.5 L-0.5 s-1"

species:
  - name: A
    description: "Half-order reactant, written as a power"
    units: mol/L
    default_concentration: 1.0
  - name: B
    description: "Product of the power form"
    units: mol/L
    default_concentration: 0.0
  - name: C
    description: "Half-order reactant, written with sqrt"
    units: mol/L
    default_concentration: 1.0
  - name: D
    description: "Product of the sqrt form"
    units: mol/L
    default_concentration: 0.0

reactions:
  - name: power_form
    description: "Half-order consumption written as a fractional power."
    rate: "k * [A] ** 0.5"
    stoichiometry:
      A: -1
      B: +1

  - name: sqrt_form
    description: "The same half-order consumption written with sqrt."
    rate: "k * sqrt([C])"
    stoichiometry:
      C: -1
      D: +1
