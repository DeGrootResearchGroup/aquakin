# PEP 639 SPDX license metadata (`license = "MIT"` + `license-files`) needs
# setuptools >= 77. `wheel` is no longer listed: setuptools vendors it and
# declaring it here is a documented no-op that only risks version skew.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aquakin"
# Single-sourced from ``aquakin.__version__`` via [tool.setuptools.dynamic]
# below, so the version lives in exactly one place (aquakin/__init__.py).
dynamic = ["version"]
description = "Reactive scalar transport kinetics for aqueous environmental systems"
readme = "README.md"
# jax/jaxlib 0.10 and diffrax 0.7 (the dependency floors below) require 3.11.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher DeGroot", email = "christopher.degroot@uwo.ca" }]
keywords = ["chemistry", "kinetics", "ozone", "bromate", "jax", "diffrax"]
# No `License :: OSI Approved` classifier: with a PEP 639 SPDX `license`
# expression above, setuptools treats a license classifier as a duplicate and
# errors on it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # Floors are the known-good minimums the suite is tested against. The
    # fast-moving JAX stack (jax/jaxlib/diffrax/optimistix) had moved many
    # releases past its original floors, so those claimed support for ancient,
    # untested versions; they are raised to the tested baseline here. No upper
    # caps: upper-bounding a library's deps propagates to consumers and causes
    # resolver conflicts. Exact, reproducible versions for CI live in the
    # committed `constraints.txt` lock instead (see the CI install step).
    "jax>=0.10",
    "jaxlib>=0.10",
    "diffrax>=0.7",
    "optimistix>=0.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
aquakin = "aquakin.__main__:main"
aquakin-ui = "aquakin_ui.__main__:main"

[project.urls]
Homepage = "https://github.com/DeGrootResearchGroup/aquakin"
Documentation = "https://aquakin.readthedocs.io"
Repository = "https://github.com/DeGrootResearchGroup/aquakin"
Issues = "https://github.com/DeGrootResearchGroup/aquakin/issues"
Changelog = "https://github.com/DeGrootResearchGroup/aquakin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# pandas powers the optional ``to_dataframe()`` / ``to_csv()`` result exporters;
# matplotlib the optional ``sol.plot(...)`` helper. Neither is needed for
# solving, only for postprocessing.
dataframe = ["pandas>=2.0"]
plot = ["matplotlib>=3.5"]
# `lint` pins the linter so a new ruff release cannot introduce rules that turn
# the gate red without a deliberate bump. Capped to the 0.15 series for the same
# reason; raise the cap intentionally.
lint = ["ruff>=0.15,<0.16"]
# `ui` is the browser flowsheet editor, `aquakin-ui` (the `aquakin_ui` package):
# trame serves the page and Vuetify draws it; the canvas is one Vue Flow widget
# shipped pre-built in the package, so it needs no JavaScript toolchain. The
# interface never imports aquakin or JAX (it asks an `aquakin serve` worker).
# trame-client pins the Vue the widget is built against (Vue 3.5).
ui = ["trame>=3.6", "trame-vuetify>=2.7", "trame-client>=3.6"]
# `typecheck` pins pyright, which checks `aquakin_ui` (see [tool.pyright]); pinned
# exactly, like ruff's cap, because a pyright release can add errors. It needs the
# `ui` extra installed too, so trame's types resolve.
typecheck = ["pyright==1.1.414"]
# `browser` drives the editor in Chromium for `tests/browser` (Playwright). Not
# part of `test`: it needs a browser download (`python -m playwright install
# chromium`), which only the `browser` CI job and a developer running those
# tests want.
browser = ["playwright>=1.63"]
# `docs` pins the Sphinx documentation toolchain (Read the Docs build + the CI
# docs job). Floors are the known-good minimums; kept in one place so the RTD
# build and CI resolve the same set. `myst-parser` lets the docs stay Markdown;
# `pydata-sphinx-theme` is the theme; autodoc/napoleon/autosummary/intersphinx/
# doctest are built into Sphinx (no separate package). The docs build imports
# aquakin for autodoc, so the package itself (and its deps) install alongside.
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "linkify-it-py>=2.0",  # MyST `linkify` extension (bare URLs -> links)
    "pydata-sphinx-theme>=0.16",
    "sphinx-copybutton>=0.5",
]
# `test` pulls in the `dataframe` + `plot` extras by self-reference so their
# pandas/matplotlib pins live in one place (the fast gate exercises the optional
# exporters/plotting helpers).
test = [
    "pytest>=7",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
    "pytest-split>=0.8",
    # pytest-cov powers the per-tier coverage reports uploaded to Codecov; it
    # cooperates with pytest-xdist (`-n`) and pytest-split (each shard emits a
    # partial `coverage.xml` that Codecov merges by flag).
    "pytest-cov>=5",
    "aquakin[dataframe,plot,ui]",
]

# Version is read statically from the ``__version__`` string literal in
# aquakin/__init__.py -- setuptools parses it via AST without importing the
# package, so this does not trigger the JAX import / x64 side effect at build
# time.
[tool.setuptools.dynamic]
version = { attr = "aquakin.__version__" }

[tool.setuptools.packages.find]
include = ["aquakin*"]

[tool.setuptools.package-data]
"aquakin.models" = ["*.yaml"]
"aquakin.plant.bsm.data" = ["*.csv"]
"aquakin_ui" = ["icons/*.svg"]
"aquakin_ui.widget" = ["serve/*"]

[tool.pytest.ini_options]
markers = [
    "validation: scientific validation tests against published data (slow)",
    "slow: multi-minute stiff/plant integration tests; excluded from the fast PR gate, run in full on merge to main",
    "heavy: peak-memory-heavy whole-plant plant-gradient tests (the BSM1 + BSM2 plant-gradient checks; a multi-GB compiled plant program each, with the compile transient peaking higher). A shard's worth accumulates compiled programs faster than the allocator frees them and OOM-kills a shared process, so the dedicated `heavy` job shards them ONE-PER-PROCESS (`-n 1`) across the free 16 GB `ubuntu-latest` runner -- a single test fits, the accumulation is what does not (a demoted BSM1 dynamic-DGSM test OOM-crashed a shared `slow` shard, so `heavy` means \"needs an isolated process\" for BSM1 as much as BSM2). The slow / validation / smoke / durations jobs all exclude them (`... and not heavy`); the free CI job runs `heavy and not xheavy` (see `xheavy`) path-filtered to adjoint/plant changes and on a `full-ci` PR; locally `pytest -m heavy`. The stable-adjoint gradient path is also smoke-tested in the fast gate on a small single-CSTR plant.",
    "xheavy: the ONE heavy test (`test_dynamic_dgsm_matches_dgsm`) that exceeds 16 GB even isolated -- it runs two DGSM engines back-to-back and holds two multi-GB BSM1 `stable_adjoint` adjoint programs live at once. It OOM-crashes the free 16 GB `ubuntu-latest` runner even one-per-process, so it is split off from the free `heavy` job (which runs `heavy and not xheavy`) onto a small larger runner (`aquakin-heavy`, 8-core/32 GB) via the `xheavy` CI job, gated identically (path filter + `full-ci`). `xheavy` IS-A `heavy` (it also carries `heavy`/`slow`), so the slow/validation/smoke jobs still exclude it; `pytest -m heavy` runs it locally.",
]
testpaths = ["tests"]

# Coverage (coverage.py via pytest-cov). Measured per CI tier (fast / slow /
# validation), each sharded across parallel jobs; `relative_files` makes the
# per-shard reports use repo-relative paths so Codecov merges them correctly
# across the different job checkouts. `branch = true` adds branch coverage.
[tool.coverage.run]
source = ["aquakin", "aquakin_ui"]
branch = true
relative_files = true
# `aquakin/models/_make_*.py` are one-off, run-by-hand generator scripts that
# emit the committed `*.yaml` models (aquakin/models is "data, not Python
# modules"); nothing imports them at runtime. They are build tooling, not
# library behaviour, so they are excluded rather than counted as uncovered.
omit = ["aquakin/models/_make_*.py"]

[tool.coverage.report]
show_missing = false

# ---------------------------------------------------------------------------
# pyright -- type checker for the editor package. The CI `typecheck` job runs
# `pyright` (basic mode) over `aquakin_ui/` only; `aquakin` itself is not
# type-checked. `pythonVersion` is the oldest Python the package supports.
[tool.pyright]
include = ["aquakin_ui"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

# ---------------------------------------------------------------------------
# ruff -- linter (and formatter config). The CI `lint` job is a required gate: it
# runs `ruff check` over `aquakin/`, `aquakin_ui/`, `tests/`, `scripts/` and
# `examples/`, and `ruff format --check` over the two packages. The 100-column
# width matches how the packages are written. Keep them formatted: run
# `ruff format aquakin aquakin_ui` before pushing (a `ruff format --check`
# mismatch fails the lint gate). `tests/`, `scripts/` and `examples/` are not
# formatted yet; do not format them as part of an unrelated change.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Start broad on the high-signal families; the `ignore` list below defers the
# rules that map to dedicated open audit issues so they can be tackled (and the
# ignore removed) in their own PRs rather than churning this tooling change.
#   E,W  pycodestyle     F   pyflakes            I    isort
#   B    flake8-bugbear  RUF ruff-specific       NPY  numpy (incl. NumPy-2.0 API)
#   PIE  flake8-pie      ICN import-conventions  FA   future-annotations
# NPY/PIE/ICN/FA were added while the package had ZERO violations of each, so
# they add no code churn -- they exist to prevent regressions (NPY in particular
# catches deprecated / NumPy-2.0 numpy API).
# C420 and SIM300 are enabled as individual rules -- the only cleanly
# safe-fixable, uncontroversial members of the C4 / SIM families. The rest of
# those families, plus TC/RET/PERF/PTH/TID/FURB, are evaluated in issue #532
# (each its own PR). `UP` (pyupgrade) modernizes the typing surface (Optional ->
# X | None, dropping quoted annotations now that every module has `from __future__
# import annotations`); its large one-time auto-fix landed as its own PR (#467).
select = ["E", "F", "W", "I", "B", "RUF", "NPY", "PIE", "ICN", "FA", "UP", "C420", "SIM300"]
ignore = [
    # `ruff format` owns line width: it reflows all code to line-length and
    # leaves only un-splittable lines long (string literals, URLs/refs in
    # comments), so E501 on those is noise rather than an actionable finding.
    "E501",
    # Intentional scientific Unicode in docstrings/comments (µ, α, β, ×, ⁻, °).
    "RUF002",
    "RUF003",
    # --- deferred to dedicated audit issues (remove the ignore in that PR) ---
    "E741",   # ambiguous names (l/r lambdas)                          -> #470 / #474
    "E731",   # lambda assigned to a name                              -> #474
    "B023",   # function uses loop variable (guarded by default-arg)   -> #470
    "B905",   # `zip()` without explicit `strict=`                     -> #474
    "B007",   # unused loop control variable                           -> #474
    "B008",   # function call in default argument                      -> #474
    "RUF005", # collection-literal concatenation                       -> #474
    "RUF007", # `zip()` instead of `itertools.pairwise`                -> #474
    "RUF059", # unused unpacked variable                               -> #474
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-export files carry deliberate, sometimes load-bearing
# import ordering -- e.g. aquakin/plant/__init__.py imports a2o / bsm.evaluation
# last to avoid an import cycle, and aquakin/__init__.py must enable x64 before
# any submodule import that builds JAX state (documented in CLAUDE.md). So they
# are exempt from import-sorting (I001) and module-import-position (E402).
"**/__init__.py" = ["I001", "E402"]
# Speciation/precipitation are imported mid-module to break an import cycle with
# core (documented at the import sites).
"aquakin/schema/model_spec.py" = ["E402"]
