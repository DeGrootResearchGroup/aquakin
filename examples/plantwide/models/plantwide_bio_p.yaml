expressions:
  nutrient_limit: monod([SNH4], KNH4_H) * monod([SPO4], KP_H)
  nutrient_limit_AN: monod([SNH4], K_S_IN) * monod([SPO4], KP_H)
  dT: '{T} - 293.15'
  dT_capped: min({T}, 293.15) - 293.15
  ph_gao: 1 / (1 + 1.2e-8 * 10 ** {pH})
  alpha_PAO_HAc: max(alpha_PAO_HAc_slope * {pH} + alpha_PAO_HAc_int, 0)
  alpha_PAO_HPr_pH: alpha_PAO_HPr + 0.2 * max({pH} - 7.5, 0)
  alpha_GAO_HAc: max(alpha_GAO_HAc_slope * {pH} + alpha_GAO_HAc_int, 0)
  decay_switch: anaerobic
  f_PP: safe_div([XPP] / 31.0, x_C_PAO)
  pha_C_PAO: '[XPHA_PAO_AC] / 36.0 + [XPHA_PAO_PR] / 39.27154472'
  x_C_PAO: '[XPAO] / 34.76'
  f_PHA_PAO: safe_div(pha_C_PAO, x_C_PAO)
  f_GLY_PAO: safe_div([XGLY_PAO] / 32.0, x_C_PAO)
  share_AC_PAO: safe_div([XPHA_PAO_AC] / 36.0, pha_C_PAO)
  share_PR_PAO: safe_div([XPHA_PAO_PR] / 39.27154472, pha_C_PAO)
  room_GLY_PAO: max(fGLY_max_PAO - f_GLY_PAO, 0)
  pha_drive_PAO: f_PHA_PAO ** (2 / 3) * x_C_PAO * monod(f_PHA_PAO, K_fPHA) * monod([SPO4], K_PO4_BIOP)
  gly_drive_PAO: f_PHA_PAO ** (2 / 3) / max(f_GLY_PAO, 0.001) * x_C_PAO * room_GLY_PAO / (room_GLY_PAO
    + K_store) * monod(f_PHA_PAO, K_fPHA_store)
  ana_store_PAO: monod(f_GLY_PAO, K_fGLY) * monod(f_PP, K_fPP)
  pha_C_GAOC: '[XPHA_GAOC_AC] / 36.66871055 + [XPHA_GAOC_PR] / 39.11466667'
  x_C_GAOC: '[XGAOC] / 34.76'
  f_PHA_GAOC: safe_div(pha_C_GAOC, x_C_GAOC)
  f_GLY_GAOC: safe_div([XGLY_GAOC] / 32.0, x_C_GAOC)
  share_AC_GAOC: safe_div([XPHA_GAOC_AC] / 36.66871055, pha_C_GAOC)
  share_PR_GAOC: safe_div([XPHA_GAOC_PR] / 39.11466667, pha_C_GAOC)
  room_GLY_GAOC: max(fGLY_max_GAO - f_GLY_GAOC, 0)
  pha_drive_GAOC: f_PHA_GAOC ** (2 / 3) * x_C_GAOC * monod(f_PHA_GAOC, K_fPHA) * monod([SPO4], K_PO4_BIOP)
  gly_drive_GAOC: f_PHA_GAOC ** (2 / 3) / max(f_GLY_GAOC, 0.001) * x_C_GAOC * room_GLY_GAOC / (room_GLY_GAOC
    + K_store) * monod(f_PHA_GAOC, K_fPHA_store)
  ana_store_GAOC: monod(f_GLY_GAOC, K_fGLY)
  pha_C_GAOA: '[XPHA_GAOA_AC] / 36.66871055 + [XPHA_GAOA_PR] / 39.11466667'
  x_C_GAOA: '[XGAOA] / 34.76'
  f_PHA_GAOA: safe_div(pha_C_GAOA, x_C_GAOA)
  f_GLY_GAOA: safe_div([XGLY_GAOA] / 32.0, x_C_GAOA)
  share_AC_GAOA: safe_div([XPHA_GAOA_AC] / 36.66871055, pha_C_GAOA)
  share_PR_GAOA: safe_div([XPHA_GAOA_PR] / 39.11466667, pha_C_GAOA)
  room_GLY_GAOA: max(fGLY_max_GAO - f_GLY_GAOA, 0)
  pha_drive_GAOA: f_PHA_GAOA ** (2 / 3) * x_C_GAOA * monod(f_PHA_GAOA, K_fPHA) * monod([SPO4], K_PO4_BIOP)
  gly_drive_GAOA: f_PHA_GAOA ** (2 / 3) / max(f_GLY_GAOA, 0.001) * x_C_GAOA * room_GLY_GAOA / (room_GLY_GAOA
    + K_store) * monod(f_PHA_GAOA, K_fPHA_store)
  ana_store_GAOA: monod(f_GLY_GAOA, K_fGLY)
  room_PP: max(fPP_max - f_PP, 0)
  pp_drive: 1 / max(f_PP, 0.001) * room_PP / (room_PP + K_store) * x_C_PAO * monod(f_PHA_PAO, K_fPHA_store)
    * monod([SPO4], K_PO4_BIOP)
