model:
  name: plantwide_bio_p
  extends: plantwide_core.yaml
  version: '0.1'
  description: 'Bio-P level of the plant-wide model: plantwide_core plus phosphate, phosphorus contents
    and the PAO-GAO competition of Lopez-Vazquez et al. (2009), PAOs in the metabolic TU Delft form and
    two GAO groups. PHA is held in two pools per population by origin (acetate, propionate) with fixed
    compositions, so every yield is a constant; pH effects are carried in the rates. Anoxic PAO/GAO processes
    use the TU Delft anoxic reduction (rates by etaNO3_BIOP, yields by an ATP/NADH ratio of 0.928); PAOs
    and GAOs keep the source''s maintenance and decay only without O2 and NO3. Generated by _make_plantwide_bio_p.py.'
  references:
  - 'Lopez-Vazquez, Oehmen, Hooijmans, Brdjanovic, Gijzen, Yuan & van Loosdrecht (2009). Modeling the
    PAO-GAO competition: effects of carbon source, pH and temperature. Water Res. 43(2), 450-462. doi:10.1016/j.watres.2008.10.032'
  - 'Smolders, van der Meij, van Loosdrecht & Heijnen (1994). Model of the anaerobic metabolism of the
    biological phosphorus removal process: stoichiometry and pH influence. Biotechnol. Bioeng. 43(6),
    461-470.'
  - Filipe, Daigger & Grady (2001). Stoichiometry and kinetics of acetate uptake under anaerobic conditions
    by an enriched culture of phosphorus-accumulating organisms at different pHs. Biotechnol. Bioeng.
    76(1), 32-43.
  - Zeng, van Loosdrecht, Yuan & Keller (2003). Metabolic model for glycogen-accumulating organisms in
    anaerobic/aerobic activated sludge systems. Biotechnol. Bioeng. 81(1), 92-105. doi:10.1002/bit.10455
  - Murnleitner, Kuba, van Loosdrecht & Heijnen (1997). An integrated metabolic model for the aerobic
    and denitrifying biological phosphorus removal. Biotechnol. Bioeng. 54(5), 434-450.
  - Meijer, van Loosdrecht & Heijnen (2001). Metabolic modelling of full-scale biological nitrogen and
    phosphorus removing WWTP's. Water Res. 35(11), 2711-2723. doi:10.1016/S0043-1354(00)00567-4
